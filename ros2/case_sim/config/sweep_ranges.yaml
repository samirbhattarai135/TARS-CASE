# Single authoritative source for every physical parameter of the CASE simulation.
#
# Both scripts/sweep.py and launch/demo.launch.py read this file. Nothing here may
# be duplicated as a literal in the URDF, the controller, or a launch file.
#
# Every value is an ESTIMATE, not a measurement. See the "Assumptions" section of
# docs/superpowers/specs/2026-09-15-case-gazebo-sim-design.md for provenance.
# Replacing an estimate with a measurement is a change to this file alone.

plant:
  # Chassis modelled as a single box; COM height is the dominant stability term.
  # A LOWER centre of mass is the harder case: the robot falls faster.
  total_mass_kg:
    nominal: 0.85
    range: [0.60, 1.20]
  com_height_above_axle_m:
    nominal: 0.070
    range: [0.045, 0.095]
  wheel_radius_m:
    nominal: 0.034
    range: [0.030, 0.040]
  wheel_separation_m:
    nominal: 0.105
    range: [0.090, 0.125]
  body_depth_m:
    nominal: 0.055
    range: [0.045, 0.070]
  wheel_friction:
    nominal: 1.0
    range: [0.70, 1.30]

  # Fixed chassis geometry. Width follows wheel_separation; height follows
  # com_height so the box's centroid lands where the COM parameter says it does.
  body_width_m: 0.100

  # MPU6050 mounting position relative to base_link origin. Deliberately offset
  # from the COM: the physical sensor sits where the board is mounted, and that
  # offset feeds centripetal acceleration into its readings during fast rotation.
  # String, in the exact form <origin xyz="..."> wants, so the URDF consumes it
  # without parsing. base_link's origin is the axle centre, not the COM.
  imu_offset_xyz_m: "0 0 0.030"

motor:
  # Constants at the GEARBOX OUTPUT SHAFT, not the bare motor.
  #
  # The first values here were an order of magnitude too small: they described
  # an ungeared motor, and the 2026-09-16 benchmark fell over because of it.
  # Working it back, they capped base acceleration at 0.55 m/s^2, so the robot
  # could not recover from a lean past 3.2 degrees and was started at 2. No set
  # of gains can rescue that -- it is an actuator limit, not a tuning problem.
  #
  # Derived from datasheet form for a small geared robot motor, an N20 at
  # 200 rpm / 6 V as the reference point:
  #   Kv = V / no-load omega  = 6 / 20.9 rad/s      = 0.287 V.s/rad
  #   R  = V / stall current  = 6 / 1.1 A           = 5.45 ohm
  #   Kt = stall torque . R / V = 0.08 . 5.45 / 6   = 0.073 N.m/A
  #
  # Kt and Kv are NOT equal at the output shaft. They are equal in SI for a bare
  # motor, but gearing multiplies speed reduction into Kv while torque gains
  # only the reduction times efficiency, so Kt/Kv is roughly that efficiency
  # (about 0.25 here). Setting them equal, as the first version did, models a
  # lossless gearbox and overstates back-EMF braking badly.
  #
  # Ranges span plausible builds from an N20 up to a TT gearmotor.
  # CALIBRATE: measure no-load RPM at 7.4 V and stall current; those two numbers
  # replace this whole estimate.
  torque_constant_kt:
    nominal: 0.073
    range: [0.040, 0.150]
  back_emf_constant_kv:
    nominal: 0.287
    range: [0.150, 0.450]
  resistance_ohm:
    nominal: 5.45
    range: [3.0, 8.0]
  supply_voltage_v:
    nominal: 7.4
    range: [7.0, 8.4]      # 2S LiPo, discharged to fully charged

sensor:
  # Transport delay is the most influential parameter in this block: derivative
  # gain applied to a delayed signal is destabilising, so the delay decides how
  # much Kd is affordable.
  delay_samples:
    nominal: 2
    range: [1, 3]
  angle_noise_sigma_deg:
    nominal: 0.10
    range: [0.05, 0.30]
  rotation_artifact_enabled:
    nominal: true
    range: [false, true]
  # Distance from the chassis rotation centre to the IMU. Rotating at omega,
  # the sensor measures a centripetal omega^2 * r on top of gravity, tilting
  # the fused "down" by atan(omega^2 * r / g) -- a bias in a known direction,
  # not noise.
  #
  # This replaces a gain on |angular acceleration| that was both dimensionally
  # wrong and numerically explosive: differentiating pitch twice divides by
  # dt^2, and on 2026-09-16 it injected swings of tens of degrees per cycle and
  # a 409-degree sample, which the PID then saturated on and fell over.
  #
  # Measurable rather than fudged: it is the z component of imu_offset_xyz_m.
  imu_lever_arm_m:
    nominal: 0.030
    range: [0.020, 0.050]

controller:
  # Gains as written in case_voice/balance_control.cpp. PID_v1 pre-scales Ki and
  # Kd by the sample time internally; these are the pre-scaling values.
  kp: 60.0
  ki: 140.0
  kd: 0.9
  sample_time_ms: 10
  output_limit: 255.0

  # setpoint = 180 + lean. The firmware's 182 encodes a 2-degree forward lean
  # compensating COM misalignment on the physical robot. A symmetric URDF has no
  # such misalignment, so the default here is 0 and the sweep can ask whether
  # that 2 degrees was compensating something real.
  lean_deg:
    nominal: 0.0
    range: [-2.0, 2.0]

  # Firmware give-up band. Outside it applyMotorControl() coasts the motors.
  # This band is also the simulation's pass criterion -- see run_protocol.
  gate_lower_deg: 150.0
  gate_upper_deg: 200.0

  # skipDeadzone remap floor. Set to 0 to reproduce self_balance.ino's actuator
  # path, which has no deadzone compensation and is the only hardware-validated
  # configuration available.
  deadzone_pwm: 20

  # Feedback polarity, +1 or -1. The sign of the loop depends on how the IMU
  # quaternion is converted to pitch and on which way the URDF points the wheel
  # joint axes -- two choices made independently. If they disagree, the
  # controller drives the robot over faster than gravity would, and the failure
  # looks like "the gains are wrong" rather than like a sign error.
  #
  # CONFIRMED +1.0 on 2026-09-16, by running both signs on identical seeds and
  # comparing the first 9 ms: at +1 pitch oscillates within 1.7 degrees of
  # upright, at -1 it diverges monotonically to 157 degrees. Do not change this
  # without repeating that comparison -- an earlier test appeared to favour -1
  # but ran through a broken sensor model and an unmeasured startup window.
  motor_direction_sign: 1.0

  # Reproduce the firmware's pre-DMP integrator wind-up at activation.
  #
  # MEASURED 2026-09-16: with this on, the robot leaves the give-up band 16 ms
  # after activation, for EITHER feedback sign, while gravity alone takes 4.3 s.
  # The startup lurch is fatal to a free-standing robot; hardware survives it
  # only because someone is holding the robot while it burns off.
  #
  # Off by default, or every run dies in the lurch and the sweep measures the
  # startup sequence rather than the gains. Turn it on deliberately to quantify
  # what the defect costs -- that is its own experiment, not this one.
  reproduce_startup_windup: false

  # The controller holds zero effort until pitch leaves this band, so the robot
  # stands at its upright equilibrium while the controller activates instead of
  # being driven through a window whose length varies run to run. Without it,
  # identical parameters gave different outcomes and a quarter of runs aborted
  # the physics engine. Must be below initial_tilt_deg, or the tilt never
  # releases the hold.
  hold_release_deg: 1.0

  # The firmware's `output / 2`. Set to 1 to remove the halving and give the
  # robot its motors' full speed range; 2 is the firmware as written.
  output_divisor: 2

run_protocol:
  initial_tilt_deg: 2.0
  settling_window_s: 3.0        # excluded from hunt measurement
  impulse_time_s: 3.0
  # Fore-aft, in the pitch plane. A two-wheel balancer is neutrally stable
  # sideways, so a lateral push tests nothing the controller is responsible for.
  impulse_magnitude_ns:
    nominal: 0.12
    range: [0.05, 0.25]
  duration_s: 10.0

  # Must match <max_step_size> in worlds/case_world.sdf. The impulse is applied
  # as a single-step wrench, so the force that delivers a given impulse is
  # magnitude / physics_step_s -- which makes this value part of the
  # experiment's definition, not just a solver setting.
  physics_step_s: 0.001
